[tox]
envlist =
    clean,
    py{38,39,310,311,312},
    stats

[testenv]
deps =
    coverage
; Needed to find locally installed fonts when testing PDF production.
passenv = HOME
download = true
commands =
    coverage run
setenv =
    PIP_EXTRA_INDEX_URL = https://py.mdrn.pl/simple
    UV_EXTRA_INDEX_URL = https://py.mdrn.pl/simple
    UV_INDEX_STRATEGY = unsafe-best-match

[testenv:clean]
basepython = python312
commands =
    coverage erase
deps = coverage

[testenv:stats]
basepython = python312
commands =
    coverage combine
    coverage report
    coverage html
deps = coverage

[coverage:run]
parallel = True
source_pkgs = librarian
command_line = -m unittest

[coverage:paths]
source = src/
    .tox/*/lib/*/site-packages/

